<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#05080F; --bg2:#0A111E; --panel:#0E1727; --panel2:#111D31;
  --line:#1B2B45; --line2:#294461;
  --cyan:#3BE3FF; --cyan2:#16A9CC; --gold:#FFC65C; --red:#FF6B6B; --green:#49E6A0;
  --ink:#EAF6FF; --muted:#8CA6C4; --faint:#5C7593;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Exo 2",system-ui,sans-serif;overflow:hidden}

/* ambient grid + vignette */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1000px 620px at 50% 42%,rgba(20,45,78,.55),transparent 70%),
   radial-gradient(1400px 900px at 50% 120%,rgba(59,227,255,.06),transparent 60%);}
.bgfx::before{content:"";position:absolute;inset:0;opacity:.14;
  background-image:linear-gradient(rgba(59,227,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,227,255,.12) 1px,transparent 1px);
  background-size:46px 46px;mask:radial-gradient(circle at 50% 45%,#000 0%,transparent 72%)}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:16px 22px;font-family:"Orbitron",sans-serif}
.bar .led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.bar .logo{font-weight:900;letter-spacing:6px;font-size:17px;color:var(--cyan);text-shadow:0 0 20px rgba(59,227,255,.55)}
.bar .clock{font-size:13px;color:var(--muted);letter-spacing:2px;font-variant-numeric:tabular-nums}
.bar .right{margin-left:auto;display:flex;gap:10px}
.barbtn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:rgba(14,23,39,.7);
  color:var(--cyan);font-family:"Orbitron";font-size:12px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:7px}
.barbtn:hover{border-color:var(--cyan);box-shadow:0 0 14px rgba(59,227,255,.2)}

/* center stage */
.stage{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:70px 20px 28px;text-align:center}
canvas#orb{width:min(72vh,480px);height:min(72vh,480px);max-width:92vw}
.statusText{font-family:"Orbitron",sans-serif;letter-spacing:4px;font-size:12px;color:var(--cyan);
  text-transform:uppercase;text-shadow:0 0 14px rgba(59,227,255,.5);min-height:16px;margin-top:-6px}
.bubble{font-size:19px;font-weight:500;line-height:1.55;max-width:620px;width:92%;min-height:28px;
  color:var(--ink);text-shadow:0 1px 14px rgba(0,0,0,.4)}

.controls{display:flex;gap:12px;align-items:center;width:92%;max-width:620px;margin-top:4px}
#textIn{flex:1;background:rgba(14,23,39,.75);border:1px solid var(--line2);border-radius:14px;color:var(--ink);
  font-family:inherit;font-size:16px;padding:15px 18px;outline:none;backdrop-filter:blur(6px)}
#textIn::placeholder{color:var(--faint)}
#textIn:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(59,227,255,.16)}
.btn-ic{width:54px;height:54px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line2);
  background:rgba(14,23,39,.75);color:var(--cyan);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.btn-ic:hover{border-color:var(--cyan)}
.send{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#042;border:0}
#micBtn.ready{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(59,227,255,.25)}
#micBtn.on{background:var(--red);border-color:var(--red);color:#fff;animation:pr 1.1s infinite}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}50%{box-shadow:0 0 0 12px rgba(255,107,107,0)}}
.quick{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:620px}
.quick button{background:rgba(14,23,39,.6);border:1px solid var(--line);color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer}
.quick button:hover{border-color:var(--cyan);color:var(--cyan)}
.hintline{font-size:12px;color:var(--faint);max-width:620px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,6,12,.55);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);z-index:45;
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-left:1px solid var(--line2);
  transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
.drawer.on{transform:translateX(0)}
.drawer .dhead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dhead b{font-family:"Orbitron";font-size:14px;letter-spacing:2px;color:var(--cyan)}
.drawer .dclose{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.tabs{display:flex;gap:6px;padding:12px 14px 0}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:"Exo 2";font-weight:700;font-size:13.5px;padding:9px 4px;cursor:pointer}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.panel-body{flex:1;overflow:auto;padding:16px 16px 28px}
.sec-h{font-family:"Orbitron";font-size:11px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin:4px 2px 12px}

.ev{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.ev .b{width:4px;background:var(--cyan)}
.ev[data-t="lab"] .b,.ev[data-t="سكشن"] .b{background:#B98CFF}
.ev[data-t="ميتنج"] .b{background:var(--gold)}
.ev[data-t="مهمة"] .b{background:var(--green)}
.ev .tm{flex:0 0 72px;text-align:center;padding:12px 4px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,.02)}
.ev .tm b{font-size:14px;font-weight:700;color:var(--cyan)}
.ev .tm span{font-size:10.5px;color:var(--muted)}
.ev .bd{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.ev .ti{font-size:14.5px;font-weight:600;line-height:1.3}
.ev .mt{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px}
.chip.lab,.chip.سكشن{background:rgba(185,140,255,.15);color:#C9ACFF}
.chip.lecture{background:rgba(59,227,255,.13);color:var(--cyan)}
.chip.ميتنج{background:rgba(255,198,92,.15);color:var(--gold)}
.chip.مهمة{background:rgba(73,230,160,.15);color:var(--green)}
.ev .ac{display:flex;flex-direction:column;gap:5px;padding:9px;justify-content:center;border-left:1px solid var(--line)}
.ev .join{background:var(--cyan);color:#042;border:0;border-radius:9px;font-weight:700;font-size:12px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:"Exo 2"}
.ev .mini{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.ev.done{opacity:.5}.ev.done .ti{text-decoration:line-through}
.ev.now{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(59,227,255,.15)}
.dayh{font-weight:700;font-size:14px;margin:18px 2px 10px;display:flex;gap:8px;align-items:center}
.dayh .np{font-size:10px;font-family:"Orbitron";color:#042;background:var(--cyan);padding:2px 8px;border-radius:999px}
.add{width:100%;border:1.5px dashed var(--line2);background:transparent;color:var(--cyan);font-family:"Exo 2";font-weight:700;font-size:13px;padding:11px;border-radius:12px;cursor:pointer;margin-bottom:8px}
.empty{color:var(--faint);text-align:center;padding:26px;font-weight:600;font-size:13.5px}
.mem{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.mem .d{width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-top:6px;flex:0 0 auto;box-shadow:0 0 8px var(--cyan)}
.mem .x{background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:15px}
.mem .t{flex:1;font-size:13.5px;line-height:1.5}.mem .w{font-size:10.5px;color:var(--faint);margin-top:3px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .l{font-weight:700;font-size:14px}.srow .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
.fld{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-family:inherit;padding:11px;font-size:14px;outline:none;margin-top:6px}
.fld:focus{border-color:var(--cyan)}
.flabel{font-size:12px;color:var(--muted);font-weight:700;margin:12px 2px 0;display:block}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line2);border:0;position:relative;cursor:pointer;flex:0 0 auto}
.sw.on{background:var(--green)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on::after{left:23px}
.bigbtn{width:100%;background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#042;border:0;border-radius:12px;font-family:"Exo 2";font-weight:800;font-size:15px;padding:13px;cursor:pointer;margin-top:14px}
.ghostbtn{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:12px;font-family:"Exo 2";font-weight:700;font-size:14px;padding:11px;cursor:pointer;margin-top:8px}

.modal{position:fixed;inset:0;background:rgba(2,5,10,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:440px;padding:20px;max-height:90vh;overflow:auto}
.modal h3{font-family:"Orbitron";font-size:14px;letter-spacing:1px;color:var(--cyan);margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;min-width:66px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-family:"Exo 2";font-weight:700;font-size:13px;padding:9px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--cyan);color:#042;border-color:var(--cyan)}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns button{flex:1;border-radius:11px;padding:12px;font-family:"Exo 2";font-weight:800;font-size:14px;cursor:pointer;border:0}
.mbtns .save{background:var(--cyan);color:#042}.mbtns .cancel{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.mbtns .del{background:transparent;color:var(--red);border:1px solid var(--line2);flex:0 0 auto;padding:0 16px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#042;font-weight:800;padding:12px 22px;border-radius:12px;z-index:80;opacity:0;transition:.25s;pointer-events:none;font-size:14px;max-width:90%;text-align:center}
.toast.on{opacity:1;bottom:36px}
.barbtn.on{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(255,107,107,.25)}
#camWrap{position:fixed;left:18px;bottom:18px;z-index:35;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:240px;max-width:44vw}
#cam{width:100%;border-radius:14px;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.55);background:#000;aspect-ratio:4/3;object-fit:cover}
#lookBtn{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#042;border:0;border-radius:11px;font-family:"Exo 2";font-weight:800;font-size:13.5px;padding:11px;cursor:pointer}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
@media(max-width:560px){canvas#orb{width:76vw;height:76vw}.bubble{font-size:17px}}
</style>
</head>
<body>
<div class="bgfx"></div>

<div class="bar">
  <span class="led" id="led"></span>
  <span class="logo">J A R V I S</span>
  <div class="right">
    <span class="clock" id="clock">--:--</span>
    <button class="barbtn" id="uploadBtn">📎 ASSIGNMENT</button>
    <button class="barbtn" id="camBtn">📷 CAMERA</button>
    <button class="barbtn" id="openDrawer">▤ SCHEDULE</button>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*,.pdf,.txt,.md,.csv,.py,.java,.c,.cpp,.js,.json" hidden>

<div id="camWrap" hidden>
  <video id="cam" autoplay playsinline muted></video>
  <button id="lookBtn">👁 Look &amp; tell me</button>
</div>
<canvas id="snap" hidden></canvas>

<div class="stage">
  <canvas id="orb" width="760" height="760"></canvas>
  <div class="statusText" id="statusText">Online</div>
  <div class="bubble" id="bubble">At your service. Try "open Teams" or "what's on tomorrow".</div>
  <div class="controls">
    <button class="btn-ic" id="micBtn" title="Speak">🎙</button>
    <input id="textIn" placeholder="Type or speak to JARVIS…" autocomplete="off">
    <button class="btn-ic send" id="sendBtn" title="Send">↑</button>
  </div>
  <div class="quick" id="quick"></div>
  <div class="hintline" id="voiceHint">Press the mic and speak — or type and hit Enter</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dhead"><b>CONTROL</b><button class="dclose" id="closeDrawer">✕</button></div>
  <div class="tabs">
    <button class="on" data-tab="today">Today</button>
    <button data-tab="week">Week</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="settings">Settings</button>
  </div>
  <div class="panel-body">
    <div id="p-today"></div>
    <div id="p-week" hidden></div>
    <div id="p-memory" hidden></div>
    <div id="p-settings" hidden></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let STATE=null, activeTab="today", enVoice=null;
const DAYEN={sat:"Saturday",sun:"Sunday",mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday"};
const JSDAY=["sun","mon","tue","wed","thu","fri","sat"];
function todayKey(){return JSDAY[new Date().getDay()];}

/* ---------------- orb ---------------- */
const cv=$("#orb"), ctx=cv.getContext("2d");
let mode="idle", t=0, level=0;
function draw(){
  t+=0.016; const W=cv.width,H=cv.height,cx=W/2,cy=H/2, baseR=182;
  ctx.clearRect(0,0,W,H);
  const pulse = mode==="idle"?1+Math.sin(t*1.6)*0.02
    : mode==="listen"?1+level*0.26+Math.sin(t*8)*0.02
    : mode==="speak"?1+level*0.2+Math.sin(t*10)*0.03
    : 1+Math.sin(t*4)*0.05;
  const R=baseR*pulse;
  const col = mode==="listen"?[255,107,107]:mode==="think"?[255,198,92]:[59,227,255];
  const c=`rgba(${col[0]},${col[1]},${col[2]}`;
  const g=ctx.createRadialGradient(cx,cy,R*0.3,cx,cy,R*2);
  g.addColorStop(0,`${c},0.2)`);g.addColorStop(1,`${c},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*2,0,7);ctx.fill();
  for(let i=0;i<4;i++){const rr=R*(1.07+i*0.14),sp=(i%2?-1:1)*(0.25+i*0.13);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*sp);
    ctx.strokeStyle=`${c},${0.33-i*0.06})`;ctx.lineWidth=i===0?2.4:1.6;
    ctx.setLineDash([rr*0.45,rr*0.95]);ctx.beginPath();ctx.arc(0,0,rr,0,7);ctx.stroke();ctx.restore();}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*0.35);
  for(let a=0;a<72;a++){const an=a/72*Math.PI*2,r1=R*1.36,r2=R*1.44+(a%6?0:9);
    ctx.strokeStyle=`${c},${a%6?0.22:0.5})`;ctx.lineWidth=a%6?1:2;
    ctx.beginPath();ctx.moveTo(Math.cos(an)*r1,Math.sin(an)*r1);ctx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2);ctx.stroke();}
  ctx.restore();
  const cg=ctx.createRadialGradient(cx,cy-R*0.14,8,cx,cy,R);
  cg.addColorStop(0,`${c},0.96)`);cg.addColorStop(0.5,`${c},0.33)`);cg.addColorStop(1,`${c},0.04)`);
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.strokeStyle=`${c},0.85)`;ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  if(mode==="speak"||mode==="listen"){
    ctx.strokeStyle=`${c},0.95)`;ctx.lineWidth=3.2;ctx.beginPath();
    const span=R*0.62;
    for(let x=-span;x<=span;x+=5){
      const amp=(R*0.3)*(level+0.12)*Math.sin(x*0.05+t*12)*Math.exp(-(x*x)/(2*(R*0.42)**2));
      const px=cx+x,py=cy+amp; x<=-span+5?ctx.moveTo(px,py):ctx.lineTo(px,py);}
    ctx.stroke();
  }else{
    ctx.fillStyle=`${c},0.92)`;ctx.font="900 60px Orbitron,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("J",cx,cy+2);
  }
  level*=0.92; requestAnimationFrame(draw);
}
draw();
function setMode(m){mode=m;const map={idle:"Online",listen:"Listening…",speak:"Speaking…",think:"Thinking…"};
  $("#statusText").textContent=map[m]||"Online";
  $("#led").style.background=m==="listen"?"var(--red)":m==="think"?"var(--gold)":"var(--green)";}

/* ---------------- voice ---------------- */
let selVoice=null; try{selVoice=localStorage.getItem("jarvis_voicename");}catch(e){}
let hideReplyText=true; try{hideReplyText=localStorage.getItem("jarvis_hidetext")!=="off";}catch(e){}
function enVoices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}
function currentVoice(){
  const vs=speechSynthesis.getVoices();
  const name=selVoice||(enVoice&&enVoice.name);
  return (name&&vs.find(x=>x.name===name))||enVoice||null;
}
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  if(selVoice){const v=vs.find(x=>x.name===selVoice);if(v){enVoice=v;return;}}
  // الأفضلية: صوت راجل بريطاني طبيعي (زي جارفيس)، بعدين أي صوت Natural
  const pref=[
    "Microsoft Ryan Online (Natural) - English (United Kingdom)",
    "Google UK English Male",
    "Microsoft Guy Online (Natural) - English (United States)",
    "Microsoft George - English (United Kingdom)",
    "Daniel (Enhanced)","Daniel",
    "Microsoft Aria Online (Natural) - English (United States)",
    "Microsoft Emma Online (Natural) - English (United States)",
    "Microsoft Sonia Online (Natural) - English (United Kingdom)",
    "Google US English","Samantha","Alex"];
  for(const p of pref){const v=vs.find(x=>x.name===p);if(v){enVoice=v;return;}}
  enVoice=vs.find(x=>/en/i.test(x.lang)&&/natural|online/i.test(x.name))
        ||vs.find(x=>/en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))||null;
}
speechSynthesis.onvoiceschanged=()=>{pickVoice(); if(activeTab==="settings")renderSettings();}; pickVoice();
/* ---- always-on hands-free voice ---- */
let st=null, speaking=false, listening=false, busy=false;
let alwaysOn=true; try{alwaysOn=localStorage.getItem("jarvis_voice")!=="off";}catch(e){}

let curUtter=null, audioUnlocked=false;
function unlockAudio(){                 // لازم أول لمسة عشان المتصفح يسمح بالصوت
  if(audioUnlocked||!("speechSynthesis"in window))return;
  try{const w=new SpeechSynthesisUtterance(" ");w.volume=0;speechSynthesis.speak(w);audioUnlocked=true;}catch(e){}
}
function speak(text){
  if(!("speechSynthesis"in window)||!text){if(alwaysOn)startRec();return;}
  speaking=true; stopRec();            // ماتسمعش نفسك وانت بتتكلم
  try{speechSynthesis.cancel();}catch(e){}
  const v=currentVoice();              // جيب الصوت بالاسم كل مرة (مايرجعش للقديم)
  const u=new SpeechSynthesisUtterance(text);
  curUtter=u;                          // امسك ريفرنس عشان المتصفح مايمسحهاش (بق معروف)
  if(v){u.voice=v; u.lang=v.lang;} else u.lang="en-US";
  u.rate=1; u.pitch=1; u.volume=1;
  u.onstart=()=>{setMode("speak");clearInterval(st);st=setInterval(()=>{level=0.6+Math.random()*0.4;},90);};
  u.onend=u.onerror=()=>{clearInterval(st);speaking=false;curUtter=null;setMode("idle");if(alwaysOn)setTimeout(startRec,250);};
  try{speechSynthesis.resume();}catch(e){}
  speechSynthesis.speak(u);
  // لو ماشتغلتش خلال نص ثانية، جرّب تاني
  setTimeout(()=>{if(speaking&&!speechSynthesis.speaking&&curUtter===u){try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}}},550);
}

let rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;
  rec.onstart=()=>{listening=true;updateMic();if(!speaking&&!busy)setMode("listen");};
  rec.onend=()=>{listening=false;updateMic();
    if(alwaysOn&&!speaking)setTimeout(startRec,300);        // يفضل سامع لوحده
    else if(mode==="listen")setMode("idle");};
  rec.onerror=e=>{listening=false;updateMic();
    if(e.error==="not-allowed"){alwaysOn=false;saveVoice();setMode("idle");toast("Allow microphone access, then tap the mic");}
    else if(e.error!=="no-speech"&&alwaysOn&&!speaking)setTimeout(startRec,500);};
  rec.onresult=e=>{
    let interim="",finalT="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i]; if(r.isFinal)finalT+=r[0].transcript; else interim+=r[0].transcript;}
    if(interim){$("#textIn").value=interim;level=0.7;}
    if(finalT.trim()){$("#textIn").value=finalT.trim();send(finalT.trim());}
  };
}else{$("#voiceHint").textContent="Voice works in Chrome. Open this in Chrome to talk.";}

function startRec(){ if(!rec||listening||speaking)return; try{rec.start();}catch(e){} }
function stopRec(){ if(rec&&listening){try{rec.stop();}catch(e){}} }
function saveVoice(){try{localStorage.setItem("jarvis_voice",alwaysOn?"on":"off");}catch(e){}}
function updateMic(){
  const b=$("#micBtn");
  b.classList.toggle("on",alwaysOn&&listening&&!speaking);
  b.classList.toggle("ready",alwaysOn&&!listening);
  $("#voiceHint").textContent = alwaysOn
    ? "Always listening — just speak. Tap the mic to mute."
    : "Voice is off. Tap the mic to start always-on listening.";
}
$("#micBtn").onclick=()=>{
  if(!rec){toast("This browser doesn't support voice — use Chrome");return;}
  alwaysOn=!alwaysOn; saveVoice();
  if(alwaysOn){startRec();toast("Listening — go ahead");}
  else{stopRec();speechSynthesis.cancel();setMode("idle");toast("Voice muted");}
  updateMic();
};
// جرّب يبدأ لوحده (المتصفح ساعات بيطلب لمسة أول مرة)
window.addEventListener("load",()=>{ if(alwaysOn)setTimeout(startRec,400); updateMic(); });
document.addEventListener("click",function once(){ unlockAudio(); if(alwaysOn)startRec(); document.removeEventListener("click",once); });

/* ---------------- send ---------------- */
async function send(text){
  text=(text||$("#textIn").value).trim();if(!text)return;
  // تحكّم صوتي في كاميرا جارفيس نفسها (مش كاميرا الويندوز)
  if(/camera|webcam|الكاميرا|كاميرا|كاميره/i.test(text)){
    const closeV=/\b(close|turn off|shut|stop|disable|hide)\b|اقفل|اقفلي|قفل|سكر|اغلق|طفي|طفّي|اطفي/i.test(text);
    const openV=/\b(open|turn on|start|enable|show|use|launch)\b|افتح|افتحي|افتحلي|شغل|شغّل|فتّح|فتح|ورّ|ورني/i.test(text);
    if(closeV){$("#textIn").value="";if(camStream){toggleCam();speak("Camera off.");}else{setMode("idle");if(alwaysOn)startRec();}return;}
    if(openV){$("#textIn").value="";if(!camStream){await toggleCam();speak("Camera on. Show me what you're holding.");}else{speak("The camera is already on.");}return;}
  }
  if(camStream&&VISION_RE.test(text)){$("#textIn").value="";askVision(text);return;}  // شوف بالكاميرا
  if(busy)return;
  busy=true; $("#textIn").value="";setMode("think");if(!hideReplyText)$("#bubble").textContent="…";
  try{
    const r=await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const d=await r.json();
    $("#bubble").textContent = hideReplyText ? "" : (d.reply||"Done.");
    busy=false;
    if(d.speak!==false)speak(d.speakText||d.reply);else{setMode("idle");if(alwaysOn)startRec();}
    loadState();
  }catch(e){busy=false;$("#bubble").textContent="Can't reach the server.";setMode("idle");if(alwaysOn)startRec();}
}
$("#sendBtn").onclick=()=>send();
$("#textIn").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
const QUICK=["What's on today","What's on tomorrow","Open Teams","Open Classroom","What time is it"];
$("#quick").innerHTML=QUICK.map(q=>`<button>${q}</button>`).join("");
$("#quick").onclick=e=>{const b=e.target.closest("button");if(b)send(b.textContent);};

/* ---------------- camera / vision ---------------- */
let camStream=null;
const video=$("#cam"), snap=$("#snap");
async function toggleCam(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;video.srcObject=null;$("#camWrap").hidden=true;$("#camBtn").classList.remove("on");toast("Camera off");return;}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=camStream;$("#camWrap").hidden=false;$("#camBtn").classList.add("on");
    unlockAudio();toast('Camera on — say "what do you see?"');
  }catch(e){toast("Can't open camera: "+((e&&e.message)||e));}
}
$("#camBtn").onclick=toggleCam;
$("#lookBtn").onclick=()=>askVision("What is the hardware part I'm holding? Name it.");
function captureFrame(){
  if(!camStream)return null;
  const w=video.videoWidth||640,h=video.videoHeight||480;
  snap.width=w;snap.height=h;snap.getContext("2d").drawImage(video,0,0,w,h);
  return snap.toDataURL("image/jpeg",0.7);
}
async function askVision(q){
  const img=captureFrame();
  if(!img){toast("Turn the camera on first");return;}
  if(busy)return; busy=true; setMode("think"); if(!hideReplyText)$("#bubble").textContent="…";
  try{
    const r=await fetch("/api/vision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img,question:q})});
    const d=await r.json(); busy=false;
    $("#bubble").textContent=hideReplyText?"":(d.reply||"");
    speak(d.reply); loadState();
  }catch(e){busy=false;setMode("idle");if(alwaysOn)startRec();toast("Vision failed");}
}
const VISION_RE=/(what do you see|do you see|can you see|how many|holding|in my hand|look at|looking at|identify|what is this|what's this|شايف|بتشوف|قدامك|قدامي|ماسك|ماسكه|ماسكها|في ايدي|في إيدي|بإيدي|ايدي|الصوره|الصورة|ايه ده|إيه ده|كام حاجه|كام اوبجكت)/i;

/* ---------------- assignment upload ---------------- */
$("#uploadBtn").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  toast("Reading "+f.name+"…"); setMode("think"); if(!hideReplyText)$("#bubble").textContent="…"; unlockAudio();
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const r=await fetch("/api/assignment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:f.name,data:reader.result})});
      const d=await r.json(); $("#bubble").textContent=hideReplyText?"":(d.reply||""); speak(d.reply);
    }catch(err){setMode("idle");if(alwaysOn)startRec();toast("Upload failed");}
  };
  reader.readAsDataURL(f); e.target.value="";
};
const CAM_OPEN=/(open|turn on|start|enable|افتح|افتحي|شغل|شغّل|فتّح|فتح).{0,8}(camera|cam\b|webcam|الكاميرا|كاميرا)/i;
const CAM_CLOSE=/(close|turn off|stop|disable|shut|اقفل|اقفلي|قفل|اغلق|سكر|طفي|طفّي).{0,8}(camera|cam\b|webcam|الكاميرا|كاميرا)/i;

/* ---------------- drawer ---------------- */
$("#openDrawer").onclick=()=>{$("#drawer").classList.add("on");$("#scrim").classList.add("on");};
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");}
$("#closeDrawer").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;

/* ---------------- state + render ---------------- */
async function loadState(){try{const r=await fetch("/api/state");STATE=await r.json();renderAll();}catch(e){}}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function tag(t){const n={lab:"Lab",lecture:"Lecture","ميتنج":"Meeting","مهمة":"Task","سكشن":"Section"};return `<span class="chip ${t}">${n[t]||"Lecture"}</span>`;}
function fmt(t){if(!t)return{h:"—",ap:""};let[h,m]=t.split(":").map(Number);let ap=h<12?"AM":"PM";let hh=h%12||12;return{h:hh+":"+String(m).padStart(2,"0"),ap};}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function toMin(t){if(!t)return 9999;let[h,m]=t.split(":").map(Number);return h*60+(m||0);}
function evHTML(it,scope,isToday){
  const f=fmt(it.time);
  const isNow=isToday&&it.time&&toMin(it.time)>=nowMin()-5&&toMin(it.time)<=nowMin()+75;
  const join=it.link?`<a class="join" href="${it.link}" target="_blank" rel="noopener">OPEN ↗</a>`:"";
  const dk=scope.ds?scope.ds+"|"+it.id:"";
  return `<div class="ev ${it.done?'done':''} ${isNow?'now':''}" data-t="${it.type}">
    <div class="b"></div>
    <div class="tm"><b>${f.h}</b><span>${f.ap}</span></div>
    <div class="bd"><div class="ti">${esc(it.title)}</div>
      <div class="mt">${tag(it.type)}${it.place?`<span>${esc(it.place)}</span>`:""}</div></div>
    <div class="ac">${join}
      ${isToday?`<button class="mini" data-done="${dk}">${it.done?'↺':'✓'}</button>`:""}
      <button class="mini" data-edit='${encodeURIComponent(JSON.stringify(it))}' data-scope="${scope.key||scope.ds}">✎</button>
    </div></div>`;
}
function renderAll(){renderToday();renderWeek();renderMemory();renderSettings();
  $("#clock").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});}
function todayDS(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function renderToday(){
  if(!STATE)return;const items=STATE.today||[],ds=todayDS();
  let h=`<div class="sec-h">${DAYEN[todayKey()]} · ${STATE.todayDate||""}</div>`;
  if(!items.length)h+=`<div class="empty">Nothing scheduled today.<br>Tell JARVIS to add something.</div>`;
  else items.forEach(it=>h+=evHTML(it,{ds},true));
  h+=`<button class="add" data-add="${ds}">+ Add to today</button>`;
  $("#p-today").innerHTML=h;
}
function renderWeek(){
  if(!STATE)return;let h="";const tk=todayKey();
  STATE.days.forEach(([k])=>{
    const list=STATE.week[k]||[];
    h+=`<div class="dayh">${DAYEN[k]}${k===tk?'<span class="np">TODAY</span>':''}</div>`;
    if(!list.length)h+=`<div class="empty" style="padding:12px;font-size:12.5px">— free —</div>`;
    else list.forEach(it=>h+=evHTML(it,{key:k},false));
    h+=`<button class="add" data-add="${k}">+ Add to ${DAYEN[k]}</button>`;
  });
  $("#p-week").innerHTML=h;
}
function renderMemory(){
  if(!STATE)return;let h=`<div class="sec-h">What JARVIS remembers about you</div>`;
  if(!STATE.memory.length)h+=`<div class="empty">Nothing yet. Say "remember that…"</div>`;
  else STATE.memory.slice().reverse().forEach(m=>{h+=`<div class="mem"><div class="d"></div><div class="t">${esc(m.text)}<div class="w">${esc(m.when||"")}</div></div><button class="x" data-delmem="${m.id}">✕</button></div>`;});
  h+=`<button class="add" data-addmem="1">+ Add a note</button>`;
  $("#p-memory").innerHTML=h;
}
function renderSettings(){
  if(!STATE)return;const s=STATE.settings,p=STATE.profile;
  $("#p-settings").innerHTML=`
    <div class="sec-h">JARVIS Brain ${s.brain_on?'<span style="color:var(--green)">● ACTIVE</span>':'<span style="color:var(--gold)">● OFF</span>'}</div>
    <div class="ds" style="line-height:1.8"><b style="color:var(--green)">Free:</b> get a key from <b>console.groq.com</b> → API Keys (starts with <code>gsk_</code>), then paste it here.</div>
    <label class="flabel">API key</label>
    <input class="fld" id="apiKey" placeholder="${s.brain_on?'•••• saved — paste a new one to change':'gsk_...'}">
    <button class="bigbtn" id="saveKey">Activate brain</button>

    <div class="sec-h" style="margin-top:24px">Voice</div>
    <select class="fld" id="voiceSel">${enVoices().map(v=>`<option value="${esc(v.name)}" ${(enVoice&&enVoice.name===v.name)?'selected':''}>${esc(v.name)}</option>`).join("")||'<option>Loading voices…</option>'}</select>
    <button class="ghostbtn" id="testVoice">🔊 Test voice</button>
    <div class="ds" style="margin-top:8px;line-height:1.7">Tip: for the most natural, human-like voice, open JARVIS in <b>Microsoft Edge</b> and pick one labeled <b>"Natural"</b> (e.g. Ryan, Guy, Aria).</div>
    <div class="srow" style="margin-top:12px"><div><div class="l">Voice only</div><div class="ds">Speak without showing the reply text</div></div>
      <button class="sw ${hideReplyText?'on':''}" id="hideSw"></button></div>

    <div class="sec-h" style="margin-top:24px">Camera / Vision ${s.gemini_on?'<span style="color:var(--green)">● ON</span>':'<span style="color:var(--gold)">● OFF</span>'}</div>
    <div class="ds" style="line-height:1.8"><b style="color:var(--green)">Free:</b> get a key from <b>aistudio.google.com</b> → "Get API key" (starts with <code>AIza</code>). Lets JARVIS see through the camera and tell you what's in front of it.</div>
    <label class="flabel">Google Gemini key</label>
    <input class="fld" id="gemKey" placeholder="${s.gemini_on?'•••• saved — paste new to change':'AIza...'}">
    <button class="bigbtn" id="saveGem">Enable camera vision</button>

    <div class="sec-h" style="margin-top:24px">iPhone calendar</div>
    <a class="bigbtn" href="/jarvis.ics" download="jarvis_calendar.ics" style="display:block;text-align:center;text-decoration:none">Download calendar</a>
    <div class="ds" style="margin-top:10px;line-height:1.7">Open it on your iPhone → Add All. You'll get an alert before every class, and a day-before alert for quizzes — offline, laptop closed.</div>

    <div class="sec-h" style="margin-top:24px">WhatsApp reminders</div>
    <div class="srow"><div><div class="l">WhatsApp reminder</div><div class="ds">Only while the laptop is on</div></div>
      <button class="sw ${s.whatsapp_enabled?'on':''}" id="waSw"></button></div>
    <label class="flabel">WhatsApp number (with country code)</label>
    <input class="fld" id="waNum" value="${esc(p.whatsapp||"")}" placeholder="+201012345678">
    <label class="flabel">Remind me before (minutes)</label>
    <input class="fld" id="remMin" type="number" value="${s.reminderMin}" min="1" max="120">
    <button class="bigbtn" id="saveSet">Save</button>
    <button class="ghostbtn" id="testWa">Send WhatsApp test</button>

    <div class="sec-h" style="margin-top:24px">Your name</div>
    <input class="fld" id="nameIn" value="${esc(p.name||"")}">
    <button class="ghostbtn" id="saveName">Save name</button>`;
}

/* tabs */
$$(".tabs button").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;
  $$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["today","week","memory","settings"].forEach(t=>$("#p-"+t).hidden=(t!==activeTab));});

/* panel clicks */
$(".panel-body").addEventListener("click",async e=>{
  const done=e.target.closest("[data-done]");
  if(done&&done.dataset.done){await fetch("/api/done",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:done.dataset.done})});loadState();return;}
  const ed=e.target.closest("[data-edit]");if(ed){openEv(JSON.parse(decodeURIComponent(ed.dataset.edit)),ed.dataset.scope);return;}
  const ad=e.target.closest("[data-add]");if(ad){openEv(null,ad.dataset.add);return;}
  const am=e.target.closest("[data-addmem]");if(am){openMem();return;}
  const dm=e.target.closest("[data-delmem]");if(dm){await fetch("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({del:dm.dataset.delmem})});loadState();return;}
  if(e.target.id==="waSw"){await saveSet({whatsapp_enabled:!STATE.settings.whatsapp_enabled});loadState();return;}
  if(e.target.id==="saveSet"){await saveSet({whatsapp:$("#waNum").value,reminderMin:$("#remMin").value});toast("Saved");loadState();return;}
  if(e.target.id==="saveName"){await saveSet({name:$("#nameIn").value});toast("Saved");loadState();return;}
  if(e.target.id==="saveKey"){const k=$("#apiKey").value.trim();if(!k){toast("Paste a key first");return;}await saveSet({api_key:k});toast("Brain activated 🧠");loadState();return;}
  if(e.target.id==="testVoice"){unlockAudio();speak("Hello, I am JARVIS. How may I help you today?");return;}
  if(e.target.id==="hideSw"){hideReplyText=!hideReplyText;try{localStorage.setItem("jarvis_hidetext",hideReplyText?"on":"off");}catch(_){}renderSettings();toast(hideReplyText?"Voice only":"Text shown");return;}
  if(e.target.id==="saveGem"){const k=$("#gemKey").value.trim();if(!k){toast("Paste a Gemini key first");return;}await saveSet({gemini_key:k});toast("Camera vision enabled 👁");loadState();return;}
  if(e.target.id==="testWa"){toast("Opening WhatsApp Web…");const r=await fetch("/api/test_whatsapp",{method:"POST"});toast((await r.json()).msg);return;}
});
async function saveSet(o){await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});}
$(".panel-body").addEventListener("change",e=>{
  if(e.target.id==="voiceSel"){selVoice=e.target.value;try{localStorage.setItem("jarvis_voicename",selVoice);}catch(_){}pickVoice();unlockAudio();speak("This is my voice now.");}
});

/* modal */
let evScope=null,evId=null,evType="lecture";
function openEv(it,scope){
  evScope=scope;evId=it?it.id:null;evType=it?it.type:"lecture";
  const types=[["lecture","Lecture"],["lab","Lab"],["سكشن","Section"],["ميتنج","Meeting"],["مهمة","Task"]];
  $("#modalBox").innerHTML=`<h3>${it?"Edit":"New"}</h3>
    <label class="flabel">Type</label><div class="seg" id="segT">${types.map(([v,l])=>`<button data-tp="${v}" class="${v===evType?'on':''}">${l}</button>`).join("")}</div>
    <label class="flabel">Title</label><input class="fld" id="eTitle" value="${it?esc(it.title):''}" placeholder="e.g. Networks quiz">
    <label class="flabel">Time</label><input class="fld" id="eTime" type="time" value="${it?it.time:''}">
    <label class="flabel">Location (optional)</label><input class="fld" id="ePlace" value="${it?esc(it.place||''):''}" placeholder="Room / Lab / Teams">
    <label class="flabel">Link (optional)</label><input class="fld" id="eLink" value="${it?esc(it.link||''):''}" placeholder="https://...">
    <div class="mbtns"><button class="save" id="evSave">Save</button>${it?'<button class="del" id="evDel">Delete</button>':''}<button class="cancel" id="evCancel">Cancel</button></div>`;
  $("#modal").classList.add("on");
  $("#segT").onclick=e=>{const b=e.target.closest("[data-tp]");if(!b)return;evType=b.dataset.tp;$$("#segT button").forEach(x=>x.classList.toggle("on",x===b));};
  $("#evCancel").onclick=closeModal;
  $("#evSave").onclick=async()=>{await fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:evId,scope:evScope,type:evType,title:$("#eTitle").value,time:$("#eTime").value,place:$("#ePlace").value,link:$("#eLink").value})});closeModal();loadState();toast("Saved");};
  if(it)$("#evDel").onclick=async()=>{await fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scope:evScope,id:evId})});closeModal();loadState();toast("Deleted");};
}
function openMem(){
  $("#modalBox").innerHTML=`<h3>New note</h3><textarea class="fld" id="mTxt" rows="3" placeholder="e.g. I study best at night"></textarea>
    <div class="mbtns"><button class="save" id="mSave">Save</button><button class="cancel" id="mCancel">Cancel</button></div>`;
  $("#modal").classList.add("on");$("#mCancel").onclick=closeModal;
  $("#mSave").onclick=async()=>{const v=$("#mTxt").value.trim();if(v)await fetch("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v})});closeModal();loadState();};
}
function closeModal(){$("#modal").classList.remove("on");}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};

/* toast */
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),3200);}

/* reminders */
if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();
async function poll(){try{const r=await fetch("/api/poll");const d=await r.json();
  (d.announce||[]).forEach(msg=>{$("#bubble").textContent=msg;speak(msg);
    try{if(Notification.permission==="granted")new Notification("JARVIS",{body:msg});}catch(e){}loadState();});
}catch(e){}}
setInterval(poll,8000);
setInterval(()=>{if(activeTab==="today")renderToday();$("#clock").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});},30000);

loadState();
setTimeout(()=>{if(STATE){const nm=STATE.profile.name||"";$("#bubble").textContent=`Hello${nm?" "+nm:""}. JARVIS online — just speak, I'm listening.`;}},600);
</script>
